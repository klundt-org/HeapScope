# HeapScope nightly fuzzing (sprint 3.7, peer review P13): the mutation tests of the index cache reader, the gcdump loader
# and (since 4.2.1) the trace reader run with many more iterations than in CI, on a new seed every night (the run number).
# A failure names its seed and iteration, so `HEAPSCOPE_FUZZ_SEED=<seed> HEAPSCOPE_FUZZ_ITERATIONS=<n>` replays it locally;
# the gcdump and trace parts also need the base they mutated (`HEAPSCOPE_FUZZ_BASE`, `HEAPSCOPE_FUZZ_TRACE`), which is kept
# with the results, with any failing input and the iteration in progress (fixture data from LeakyConsole and LeakyApi
# only). A schedule runs on the default branch's copy of this file, so it checks out develop explicitly: the nightly fuzzes
# the code in progress, not the last release.
name: Fuzz

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  HEAPSCOPE_FUZZ_ITERATIONS: '2000'
  HEAPSCOPE_FUZZ_SEED: ${{ github.run_number }}

jobs:
  fuzz:
    name: Fuzz the cache reader, the gcdump loader and the trace reader
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build HeapScope.sln -c Release
      - name: Index caches
        shell: bash
        run: dotnet test --project tests/HeapScope.Storage.Tests -c Release --no-build --filter-class "*SignedCacheTests" --report-xunit-trx --results-directory "$RUNNER_TEMP/fuzz-results"
      - name: Gcdumps
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HEAPSCOPE_FUZZ_KEEP: ${{ runner.temp }}/fuzz-results/inputs
        run: dotnet test --project tests/HeapScope.Integration.Tests -c Release --no-build --filter-class "*CraftedGcDumpTests" --report-xunit-trx --results-directory "$RUNNER_TEMP/fuzz-results"
      - name: Traces
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HEAPSCOPE_FUZZ_KEEP: ${{ runner.temp }}/fuzz-results/inputs
          # A copy that asks for more memory than this fails the test, and the runner stays up.
          DOTNET_GCHeapHardLimit: '0x100000000'
        run: dotnet test --project tests/HeapScope.Integration.Tests -c Release --no-build --filter-class "*CraftedTraceTests" --report-xunit-trx --results-directory "$RUNNER_TEMP/fuzz-results"
      - name: Keep the results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-results
          path: ${{ runner.temp }}/fuzz-results
          if-no-files-found: warn
          retention-days: 14

  # Peer review 4.5 H19: the nightly failed 15 of its first 23 nights and nobody saw it. A failed scheduled run opens an issue, or adds
  # a comment to the one still open, with its seed and a link, so the owner is told by GitHub. A run by hand reports nothing.
  report:
    name: Report a failed night
    needs: fuzz
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SEED: ${{ github.run_number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly fuzz failed"
          body="The nightly fuzz failed with seed $SEED: $RUN (its log names the step that failed). Its results, kept 14 days, hold the iteration and any failing input, and the gcdump and trace it mutated (base.gcdump, base.nettrace). Replay with HEAPSCOPE_FUZZ_SEED=$SEED HEAPSCOPE_FUZZ_ITERATIONS=2000, and HEAPSCOPE_FUZZ_BASE or HEAPSCOPE_FUZZ_TRACE for those parts (DEVELOPER.md, Fuzzing)."
          open=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
