# HeapScope CI (sprints 2.3.5, 2.3.6 and 3.6):
# - Windows builds everything, runs the fast and the integration tests, captures the LeakyConsole fixture with the CLI and
#   checks the known answers. The heavy integration tests run in a second Windows job beside it.
# - Linux builds the engine, the worker, the CLI and the Avalonia app, runs their tests, takes a core dump of the fixture
#   with dotnet-dump, checks the CLI's known answers and opens the dump in the app without a display.
# - Packages: self-contained builds per runtime identifier with their license files (checked), in their release archives,
#   built beside the tests and uploaded as artifacts on manual runs. The Windows and Linux ones are unpacked
#   and run as a user gets them, without .NET (Linux in a plain Ubuntu container), on a fixture dump, and the CLI's
#   dotnet tool is packed and installed from its file (sprint 3.9, ADR-039).
# - No macOS runners (owner, 2026-10-31: their minutes cost about ten times Linux's). The macOS packages are built on
#   Linux and not run; nothing here tests on macOS.
# - Once per change (2026-11-17): on PRs (which test the merge of the change into its target, what lands) and by hand,
#   not again on the push that merges it. A PR that changes only Markdown files and docs/ runs the Linux job's tests
#   (they check every Markdown file's links and text rules, and the info texts) and skips the others. "CI passed" sums up
#   the jobs and is the one check the ruleset requires, so a skipped job never leaves a required check waiting.
# Tests run through build/test.sh and the fixture dump through build/fixture-dump.sh, as in the local gate (build/gate.sh).
# Test results (TRX: test names, outcomes and messages) are kept 14 days to track tests that fail now and then.
# Fixture dumps hold fixture data only and are never uploaded (ARCHITECTURE.md 12). Nothing here sends telemetry.
# Actions are pinned to the commit of a release (sprint 3.7, peer review P16); Dependabot proposes updates as PRs. CI
# restores packages in locked mode (Directory.Build.props: packages.lock.json in every project).
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Avalonia's build statistics (sprint 2.3.6, decision 5); Directory.Build.targets also removes the task that sends them.
  AVALONIA_TELEMETRY_OPTOUT: '1'
  # HeapScope's own logs (the CLI, the app and the workers they start; paths, counts and rules, never dump contents) go
  # to the runner's temp folder and are kept with the test results (sprint 3.6 review).
  Logging__File__Directory: ${{ github.workspace }}/artifacts/heapscope-logs

jobs:
  changes:
    # Whether the change needs the build jobs: no when every file it changes, adds, removes or renames is a Markdown file
    # or under docs/. A manual run, or a change the API cannot list in full (3000 files), runs everything.
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR" ]; then
            echo "A manual run: every job runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          other=$(printf '%s\n' "$files" | grep -vE '(\.md$|^docs/)' || true)
          if [ "$count" -eq 0 ] || [ "$count" -ge 3000 ] || [ -n "$other" ]; then
            echo "$count files; not only docs, so every job runs. For example:"
            printf '%s\n' "$other" | head -5
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "$count files, Markdown and docs/ only: the Linux job's tests run, the other jobs are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (build, fast and integration tests, fixture capture)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        id: build
        run: dotnet build HeapScope.sln -c Release
      - name: Fast tests
        timeout-minutes: 15
        shell: bash
        run: bash build/test.sh fast Release "$RUNNER_TEMP/test-results"
      - name: Integration tests
        # Sprint 3.6 (peer review P4): real captures, dumps, workers and the CLI. The heavy collection runs in its own
        # job beside this one (2026-10-31, so a PR waits about half as long).
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        shell: bash
        run: bash build/test.sh integration-light Release "$RUNNER_TEMP/test-results"
      - name: Capture the fixture with the CLI and check the known answers
        # Sprint 2.3.6 (2.3.5 review M3): the Windows DAC path and capture, checked by CI too.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        run: |
          cli=src/HeapScope.Cli/bin/Release/net10.0/heapscope-cli.exe
          bash build/fixture-dump.sh "$RUNNER_TEMP/leaky.dmp" "cli=$cli"
          bash build/check-known-answers.sh "$cli" "$RUNNER_TEMP/leaky.dmp"
          # A missing DAC and the symbol server's download rule on a real dump (sprint 3.12, the review of task 9).
          HEAPSCOPE_FIXTURE_DUMP="$RUNNER_TEMP/leaky.dmp" HEAPSCOPE_REQUIRE_FIXTURE=1 dotnet test --project tests/HeapScope.Loaders.ClrMd.Tests -c Release --no-build --filter-class "*MissingDacTests" --filter-class "*WalkComparisonTests"
      - name: Keep the test results and HeapScope's logs
        # Always, so a step that timed out still leaves its results (review).
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  windows-heavy:
    # The integration tests that load the machine heavily (gigabyte heaps and dumps, the Ctrl+C capture), which run one
    # at a time: about three minutes on their own, so they run beside the Windows job instead of after its tests.
    name: Windows heavy integration tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build HeapScope.sln -c Release
      - name: Heavy integration tests
        timeout-minutes: 20
        shell: bash
        run: bash build/test.sh integration-heavy Release "$RUNNER_TEMP/test-results"
      - name: Keep the test results and HeapScope's logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows-heavy
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  unix:
    name: ${{ matrix.name }} (engine, CLI, app, fixture dump)
    # Runs for every change: its tests check the Markdown files too. A docs-only change skips the fixture dump.
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build the CLI and the app (with the worker) and the fixture
        id: build
        run: |
          dotnet build src/HeapScope.Cli -c Release
          dotnet build src/HeapScope.UI -c Release
          dotnet build fixtures/LeakyConsole -c Release
      - name: Tests
        # Every test project that runs here, found by build/test.sh rather than listed (peer review S1).
        timeout-minutes: 15
        run: bash build/test.sh fast Release "$RUNNER_TEMP/test-results"
      - name: Dump the fixture, check the known answers, open it in the app without a display
        # Runs when a test failed but the build did not: the dump, the CLI and the app are what this job is for.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && needs.changes.outputs.code == 'true' }}
        timeout-minutes: 15
        run: |
          dotnet tool install --global dotnet-dump --version 10.0.750501
          export PATH="$PATH:$HOME/.dotnet/tools"
          dump="$RUNNER_TEMP/leaky.dmp"
          bash build/fixture-dump.sh "$dump" dotnet-dump
          bash build/check-known-answers.sh src/HeapScope.Cli/bin/Release/net10.0/heapscope-cli "$dump"
          # The trust of a DAC next to a dump, where no signature check backs it (sprint 3.7, 3.6 review M19), and a missing
          # DAC with the symbol server's download rule (sprint 3.12), and the loader's object walk against ClrMD's on a core dump
          # (sprint 3.12 review M1).
          HEAPSCOPE_FIXTURE_DUMP="$dump" HEAPSCOPE_REQUIRE_FIXTURE=1 dotnet test --project tests/HeapScope.Loaders.ClrMd.Tests -c Release --no-build --filter-class "*PlantedDacTests" --filter-class "*MissingDacTests" --filter-class "*WalkComparisonTests"
          # The Avalonia app opens the core dump headless and drills down as a user would (sprint 2.3.6).
          app=src/HeapScope.UI/bin/Release/net10.0/HeapScope
          "$app" --headless --smoke-open "$dump" --Logging:File:Directory "$RUNNER_TEMP/ui-log" || { cat "$RUNNER_TEMP"/ui-log/*.log; exit 1; }
          grep -h "Smoke open\|Smoke drill" "$RUNNER_TEMP"/ui-log/*.log | cut -c1-400
          grep -q "Smoke open types: .*Fixtures.Leaks.StaticCacheEntry 2000" "$RUNNER_TEMP"/ui-log/*.log || { echo "The app did not show 2000 StaticCacheEntry objects"; exit 1; }
      - name: Keep the test results and HeapScope's logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/test-results
            ${{ github.workspace }}/artifacts/heapscope-logs
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package ${{ matrix.rid }}
    # Runs beside the tests rather than after them (2026-10-31: three minutes off every run). A manual run uploads its
    # builds whatever its tests do.
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            runs: true
          - os: ubuntu-latest
            rid: linux-x64
            runs: true
          # Built on Linux, which cannot run them (no macOS runners).
          - os: ubuntu-latest
            rid: osx-arm64
            runs: false
          - os: ubuntu-latest
            rid: osx-x64
            runs: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No token is left in the checkout for later steps (sprint 3.7, peer review P16).
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: SkiaSharp native library is built for this SkiaSharp (ADR-038)
        # Fails with the steps when an Avalonia update brought a new SkiaSharp: the library is rebuilt by hand (rare).
        shell: bash
        run: bash build/skia-native.sh check
      - name: Pack the CLI as a dotnet tool
        # Before the publish: a publish for a runtime identifier rewrites the lock files, and the tool restores locked.
        if: ${{ matrix.runs }}
        shell: bash
        run: bash build/pack-tool.sh "$RUNNER_TEMP/tool"
      - name: Publish the app and the CLI, self-contained, with the worker and the license files, in the release archive
        # publish.sh copies the license files and checks the folder (build/check-package.sh, sprint 3.6, peer review P3).
        # The archive is the release's (sprint 3.9): a .zip for Windows; a .tar.gz elsewhere, which keeps the executables'
        # modes that an artifact upload of the folder drops (sprint 2.3.6 review H1).
        shell: bash
        run: |
          bash build/publish.sh ${{ matrix.rid }} "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}"
          archive=$(bash build/archive.sh pack "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}" "$RUNNER_TEMP/out")
          du -sh "$RUNNER_TEMP/HeapScope-${{ matrix.rid }}" "$archive"
      - name: Unpack the archive and take a dump of the fixture
        if: ${{ matrix.runs }}
        shell: bash
        run: |
          dir=$(bash build/archive.sh unpack "$RUNNER_TEMP"/out/HeapScope-${{ matrix.rid }}.* "$RUNNER_TEMP/unpacked")
          echo "UNPACKED=$dir" >> "$GITHUB_ENV"
          dotnet build fixtures/LeakyConsole -c Release
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            # Captured by the unpacked CLI, as a user would.
            bash build/fixture-dump.sh "$RUNNER_TEMP/dump/leaky.dmp" "cli=$dir/heapscope-cli.exe"
          else
            dotnet tool install --global dotnet-dump --version 10.0.750501
            export PATH="$PATH:$HOME/.dotnet/tools"
            bash build/fixture-dump.sh "$RUNNER_TEMP/dump/leaky.dmp" dotnet-dump
          fi
      - name: Run the build as a user gets it, without .NET
        # The CLI, its worker and the app (without a display) open the fixture dump (build/check-install.sh). Windows hides
        # its installed .NET; Linux runs in a plain Ubuntu container with only the libraries INSTALL.md lists. The image
        # runs the check only; nothing built in it ships.
        if: ${{ matrix.runs }}
        shell: bash
        run: |
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            bash build/check-install.sh "$UNPACKED" "$RUNNER_TEMP/dump/leaky.dmp"
          else
            # The container runs as root, and HeapScope's files are private to their owner: hand them back to the runner's
            # user afterwards, so the logs can be uploaded.
            docker run --rm -e HEAPSCOPE_DATA_FOLDER=/tmp/heapscope -e Logging__File__Directory=/dump/logs -e OWNER="$(id -u):$(id -g)" \
              -v "$UNPACKED:/heapscope:ro" -v "$RUNNER_TEMP/dump:/dump" \
              -v "$PWD/build:/build:ro" ubuntu:24.04 bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              libicu74 libfontconfig1 > /dev/null && bash /build/check-install.sh /heapscope /dump/leaky.dmp; code=$?; \
              chown -R "$OWNER" /dump; exit $code'
          fi
      - name: Install the CLI's dotnet tool from its file
        if: ${{ matrix.runs }}
        shell: bash
        run: bash build/check-tool.sh "$RUNNER_TEMP/tool" "$RUNNER_TEMP/dump/leaky.dmp"
      - name: Keep HeapScope's logs
        # So a failed check above can be explained (3.9 review M7). Logs hold paths and type names, never dump values.
        if: ${{ always() && matrix.runs }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-logs-${{ matrix.rid }}
          path: |
            artifacts/heapscope-logs
            ${{ runner.temp }}/dump/logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload
        # Build output only; on manual runs (sprint 2.3.6, decision 7; pushes no longer run CI since 2026-11-17).
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HeapScope-${{ matrix.rid }}
          path: ${{ runner.temp }}/out/HeapScope-${{ matrix.rid }}.*
          retention-days: 14

  passed:
    # The one check the ruleset "Protect main and develop" requires (2026-11-17). It passes when every job passed, or, for
    # a docs-only change, when the jobs it does not need were skipped. A skipped matrix job never creates its named checks,
    # so requiring those directly would leave a docs-only PR waiting.
    name: CI passed
    needs: [changes, windows, windows-heavy, unix, package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if [ "$CODE" = "true" ]; then allowed='["success"]'; else allowed='["success","skipped"]'; fi
          bad=$(printf '%s' "$RESULTS" | jq --argjson ok "$allowed" '[to_entries[] | select(.value.result as $r | $ok | index($r) | not)] | length')
          [ "$(printf '%s' "$RESULTS" | jq -r '.changes.result')" = "success" ] || { echo "Could not tell what changed."; exit 1; }
          [ "$bad" -eq 0 ] || { echo "$bad job(s) did not pass."; exit 1; }
          echo "CI passed."
