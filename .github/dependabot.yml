# Dependabot (sprint 3.7, peer review P16): weekly pull requests into develop for NuGet packages (Directory.Packages.props
# and the lock files) and for the pinned GitHub Actions. Each goes through CI like any change. Before an Avalonia update,
# check that no component HeapScope uses moved to a paid license (ADR-025). An Avalonia update that brings a new
# SkiaSharp fails CI's "SkiaSharp native library" check on purpose: HeapScope's own SkiaSharp native library must first
# be rebuilt by hand (ADR-038; the check prints the steps; DEVELOPER.md section 7 has them in full).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The .NET libraries follow the runtime HeapScope targets (.NET 10, long-term support): a new major version of them (11.0.0
    # of Microsoft.Extensions.*, for .NET 11) comes with a deliberate move to a new runtime, not a weekly bump (2026-11-16).
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
    # Grouped so a week's updates take one CI run, not one each (2026-11-17). Avalonia and SkiaSharp come in their own PR,
    # since they need the license check and can need the SkiaSharp rebuild; a package goes in the first group it matches.
    # Major versions of other packages still come one per PR.
    groups:
      avalonia:
        patterns: ["Avalonia*", "SkiaSharp*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # All action updates in one PR (2026-11-17).
    groups:
      actions:
        patterns: ["*"]
